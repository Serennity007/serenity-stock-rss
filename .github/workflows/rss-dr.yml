name: RSS disaster recovery
on:
  push:
    paths: ['server/dr/**', '.github/workflows/rss-dr.yml']
  pull_request:
    paths: ['server/dr/**', '.github/workflows/rss-dr.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test server/dr/*.check.*
      - run: python3 -m unittest discover -s server/dr -p 'test_*.py'
      - run: python3 -m compileall -q server/dr
